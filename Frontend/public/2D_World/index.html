<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge;chrome=1" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable = no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title dir="ltr">3D CSS Solar System</title>
    <link
      rel="stylesheet"
      type="text/css"
      media="screen"
      href="css/styles.css"
    />
  </head>
  <body class="opening hide-UI view-2D zoom-large data-close controls-close">
    <div id="navbar">
      <a id="toggle-data" href="#data"><i class="icon-data"></i>Data</a>
      <h1>3D CSS Solar System</h1>
      <a id="toggle-controls" href="#controls"
        ><i class="icon-controls"></i>Controls</a
      >
    </div>

    <div id="data">
      <a class="sun" title="sun" href="#sunspeed">Sun</a>
      <a class="mercury" title="mercury" href="#mercuryspeed">Mercury</a>
      <a class="venus" title="venus" href="#venusspeed">Venus</a>
      <a class="earth active" title="earth" href="#earthspeed">Earth</a>
      <a class="mars" title="mars" href="#marsspeed">Mars</a>
      <a class="jupiter" title="jupiter" href="#jupiterspeed">Jupiter</a>
      <a class="saturn" title="saturn" href="#saturnspeed">Saturn</a>
      <a class="uranus" title="uranus" href="#uranusspeed">Uranus</a>
      <a class="neptune" title="neptune" href="#neptunespeed">Neptune</a>
    </div>
    <div id="controls">
      <label class="set-view">
        <input type="checkbox" />
      </label>
      <label class="set-zoom">
        <input type="checkbox" />
      </label>
      <label>
        <input type="radio" class="set-speed" name="scale" checked />
        <span>Speed</span>
      </label>
      <label>
        <input type="radio" class="set-size" name="scale" />
        <span>Size</span>
      </label>
      <label>
        <input type="radio" class="set-distance" name="scale" />
        <span>Distance</span>
      </label>
    </div>
    <div id="universe" class="scale-stretched">
      <div id="galaxy">
        <div id="solar-system" class="earth">
          <div id="mercury" class="orbit">
            <div class="pos">
              <div class="planet">
                <dl class="infos">
                  <dt>Mercury</dt>
                  <dd><span></span></dd>
                </dl>
              </div>
            </div>
          </div>
          <div id="venus" class="orbit">
            <div class="pos">
              <div class="planet">
                <dl class="infos">
                  <dt>Venus</dt>
                  <dd><span></span></dd>
                </dl>
              </div>
            </div>
          </div>
          <div id="earth" class="orbit">
            <div class="pos">
              <div class="orbit">
                <div class="pos">
                  <div class="moon"></div>
                </div>
              </div>
              <div class="planet">
                <dl class="infos">
                  <dt>Earth</dt>
                  <dd><span></span></dd>
                </dl>
              </div>
            </div>
          </div>
          <div id="mars" class="orbit">
            <div class="pos">
              <div class="planet">
                <dl class="infos">
                  <dt>Mars</dt>
                  <dd><span></span></dd>
                </dl>
              </div>
            </div>
          </div>
          <div id="jupiter" class="orbit">
            <div class="pos">
              <div class="planet">
                <dl class="infos">
                  <dt>Jupiter</dt>
                  <dd><span></span></dd>
                </dl>
              </div>
            </div>
          </div>
          <div id="saturn" class="orbit">
            <div class="pos">
              <div class="planet">
                <div class="ring"></div>
                <dl class="infos">
                  <dt>Saturn</dt>
                  <dd><span></span></dd>
                </dl>
              </div>
            </div>
          </div>
          <div id="uranus" class="orbit">
            <div class="pos">
              <div class="planet">
                <dl class="infos">
                  <dt>Uranus</dt>
                  <dd><span></span></dd>
                </dl>
              </div>
            </div>
          </div>
          <div id="neptune" class="orbit">
            <div class="pos">
              <div class="planet">
                <dl class="infos">
                  <dt>Neptune</dt>
                  <dd><span></span></dd>
                </dl>
              </div>
            </div>
          </div>
          <div id="sun">
            <dl class="infos">
              <dt>Sun</dt>
              <dd><span></span></dd>
            </dl>
          </div>
        </div>
      </div>
    </div>

    <!-- NEO Exploration Button -->
    <a id="neo-button" href="../3D_World/index.html">
      <span class="rocket-icon">🚀</span>
      <span class="button-text">Explore NEOs</span>
    </a>

    <!-- Rocket Transition Overlay -->
    <div id="rocket-transition" class="rocket-transition">
      <div class="flying-rocket">🚀</div>
      <div
        class="star-trail"
        style="top: 80%; left: 10%; animation-delay: 0.5s"
      ></div>
      <div
        class="star-trail"
        style="top: 60%; left: 20%; animation-delay: 0.8s"
      ></div>
      <div
        class="star-trail"
        style="top: 50%; left: 35%; animation-delay: 1.1s"
      ></div>
      <div
        class="star-trail"
        style="top: 40%; left: 50%; animation-delay: 1.4s"
      ></div>
      <div
        class="star-trail"
        style="top: 30%; left: 65%; animation-delay: 1.7s"
      ></div>
      <div class="loading-text">Preparing Launch...</div>
    </div>

    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.8.1/jquery.min.js"></script>
    <script type="text/javascript">
      if (typeof jQuery == "undefined") {
        document.write(
          unescape(
            "%3Cscript src='js/jquery.min.js' type='text/javascript'%3E%3C/script%3E"
          )
        );
      }
    </script>
    <script src="js/prefixfree.min.js"></script>
    <script src="js/scripts.min.js"></script>

    <!-- Rocket Transition Script -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const neoButton = document.getElementById("neo-button");
        const rocketTransition = document.getElementById("rocket-transition");

        neoButton.addEventListener("click", function (e) {
          e.preventDefault(); // Prevent immediate navigation

          // Get the target URL
          const targetUrl = this.href;

          // Start the rocket transition
          rocketTransition.classList.add("active");

          // Navigate after the animation completes
          setTimeout(function () {
            window.location.href = targetUrl;
          }, 2200); // Wait for animation to complete (2s animation + 200ms buffer)
        });

        // Optional: Add keyboard support (Enter key)
        neoButton.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            this.click();
          }
        });
      });
    </script>
  </body>
</html>
